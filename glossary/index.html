<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>白書2026 索引辞典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 索引カードの棚。左に見出し付きの索引リスト、右に1語ずつの学習カード（狭い画面ではカードが全面に重なる） */
:root{
  --paper:#f3f5f9;      /* 地 */
  --card:#ffffff;       /* カード面 */
  --ink:#141d33;        /* 本文 */
  --muted:#5a6479;      /* 補助 */
  --rule:#d9dee8;       /* 罫 */
  --band:#22346f;       /* 索引見出し帯（白書の紺） */
  --band-ink:#ffffff;
  --accent:#2c56c9;     /* 操作色 */
  --accent-soft:#e6ecfb;
  --learning:#b26a00;   --learning-soft:#fdf0d9;
  --mastered:#1f7a4d;   --mastered-soft:#ddf2e6;
  --hl:#fff1a8;
  --shadow:0 1px 2px rgba(20,29,51,.06),0 6px 24px rgba(20,29,51,.06);
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1422; --card:#171e30; --ink:#e7ebf4; --muted:#9aa5bd; --rule:#2a3350;
  --band:#2b3f86; --band-ink:#ffffff; --accent:#8aa8ff; --accent-soft:#1f2b4f;
  --learning:#f0b45a; --learning-soft:#3a2c14; --mastered:#5fd39a; --mastered-soft:#163527;
  --hl:#5a4b10; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1422; --card:#171e30; --ink:#e7ebf4; --muted:#9aa5bd; --rule:#2a3350;
  --band:#2b3f86; --band-ink:#ffffff; --accent:#8aa8ff; --accent-soft:#1f2b4f;
  --learning:#f0b45a; --learning-soft:#3a2c14; --mastered:#5fd39a; --mastered-soft:#163527;
  --hl:#5a4b10; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{display:flex;flex-direction:column;height:100%;max-width:1280px;margin:0 auto;padding-inline:16px}

/* ヘッダー */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:18px 12px}
.brand{min-width:0}
.brand .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3vw,30px);line-height:1.25;text-wrap:balance}
.progress{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:0 1 320px}
.progress .nums{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.progress .nums b{font-family:var(--f-num);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--rule)}
.dot.l{background:var(--learning)} .dot.m{background:var(--mastered)}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--mastered)} .bar .l{background:var(--learning)}

/* 本体 */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:20px;padding-bottom:16px}
.pane-list{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.tools{display:flex;flex-direction:column;gap:10px;padding:12px;border-bottom:1px solid var(--rule)}
.search{position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--band);color:var(--band-ink)}
select.filter{border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:6px 8px;font-size:13px;flex:1;min-width:120px}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.listwrap{flex:1;min-height:0;display:flex}
.jump{display:flex;flex-direction:column;gap:1px;padding:6px 2px;border-right:1px solid var(--rule);overflow-y:auto;scrollbar-width:none}
.jump button{border:0;background:none;font-size:11px;line-height:1.2;padding:3px 5px;color:var(--muted);cursor:pointer;border-radius:4px;white-space:nowrap}
.jump button:hover{background:var(--accent-soft);color:var(--accent)}
.list{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain}
.group-h{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 12px;background:var(--band);color:var(--band-ink);font-weight:700;font-size:13px;letter-spacing:.06em}
.group-h small{font-family:var(--f-num);font-weight:500;opacity:.8;letter-spacing:0}
.item{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:9px 12px;cursor:pointer}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .t{min-width:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.item .p{font-family:var(--f-num);font-size:11px;color:var(--muted);white-space:nowrap}
.item .memo-mark{font-size:11px;color:var(--accent);margin-left:6px}
.item mark,.card mark{background:var(--hl);color:inherit;border-radius:2px}
.empty{padding:32px 16px;color:var(--muted);text-align:center;font-size:14px}

/* 学習カード */
.pane-detail{min-height:0;overflow-y:auto}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:clamp(18px,3vw,32px);max-width:760px}
.card-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.btn.back{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--rule);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08);color:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);background:var(--paper);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.sec{background:var(--band);border-color:var(--band);color:var(--band-ink);cursor:default}
.card h2{margin:0 0 4px;font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.6vw,30px);line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.pages{font-size:13px;color:var(--muted)}
.pages b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.block{margin-top:22px;max-width:65ch}
.label{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
.def{font-size:17px;line-height:1.75;font-weight:500;margin:0;padding-left:14px;border-left:3px solid var(--band)}
.exp{margin:0}
.url a{color:var(--accent);overflow-wrap:anywhere}
.url .none{color:var(--muted);font-size:14px}
.study{margin-top:26px;padding-top:20px;border-top:1px dashed var(--rule);display:flex;flex-direction:column;gap:14px}
.status{display:flex;gap:8px;flex-wrap:wrap}
.status button{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:500}
.status button[aria-pressed="true"][data-v="0"]{background:var(--paper);color:var(--ink);border-color:var(--muted)}
.status button[aria-pressed="true"][data-v="1"]{background:var(--learning-soft);color:var(--learning);border-color:var(--learning)}
.status button[aria-pressed="true"][data-v="2"]{background:var(--mastered-soft);color:var(--mastered);border-color:var(--mastered)}
textarea#memo{width:100%;min-height:150px;resize:vertical;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--paper);line-height:1.7}
.memo-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding-block:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--rule)}
.foot .row{gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:13px;z-index:50;box-shadow:var(--shadow)}

/* 狭い画面：カードを全面に重ねる */
@media (max-width:860px){
  .main{grid-template-columns:1fr}
  .pane-detail{position:fixed;inset:0;z-index:20;background:var(--paper);padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:none}
  body.detail-open .pane-detail{display:block}
  body.detail-open{overflow:hidden}
  .btn.back{display:inline-flex}
  .card{box-shadow:none}
  .progress{flex-basis:100%}
}
@media (prefers-reduced-motion:no-preference){
  .card{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">情報セキュリティ白書2026 ／ 付録・索引 p.201–206</div>
      <h1>白書2026 索引辞典</h1>
    </div>
    <div class="progress" aria-label="学習の進み具合">
      <div class="nums">
        <span><span class="dot m"></span>習得 <b id="nM">0</b></span>
        <span><span class="dot l"></span>学習中 <b id="nL">0</b></span>
        <span><span class="dot"></span>未学習 <b id="nU">0</b></span>
        <span>／ 全 <b id="nAll">0</b> 語</span>
      </div>
      <div class="bar"><i class="m" id="barM"></i><i class="l" id="barL"></i></div>
    </div>
  </header>

  <main class="main">
    <section class="pane-list" aria-label="索引">
      <div class="tools">
        <label class="search" for="q">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input id="q" type="search" placeholder="用語・説明文を検索（例：ランサム、EU、AISI）" autocomplete="off">
        </label>
        <div class="row">
          <div class="seg" role="group" aria-label="並べ方">
            <button type="button" id="modeKana" aria-pressed="true">50音順</button>
            <button type="button" id="modeTheme" aria-pressed="false">テーマ別</button>
          </div>
          <select id="fStatus" class="filter" aria-label="学習状態で絞り込み">
            <option value="all">すべての状態</option>
            <option value="0">未学習のみ</option>
            <option value="1">学習中のみ</option>
            <option value="2">習得のみ</option>
            <option value="memo">メモありのみ</option>
          </select>
        </div>
        <div class="row" style="justify-content:space-between">
          <span class="count" id="count"></span>
          <button type="button" class="btn" id="nextUnlearned">未学習の語へ</button>
        </div>
      </div>
      <div class="listwrap">
        <nav class="jump" id="jump" aria-label="見出しへ移動"></nav>
        <div class="list" id="list" role="list"></div>
      </div>
    </section>

    <section class="pane-detail" id="detail" aria-live="polite"></section>
  </main>

  <footer class="foot">
    <span id="storeInfo">メモと学習状態はこのブラウザに保存されます。</span>
    <div class="row">
      <button type="button" class="btn" id="exportBtn">メモを書き出す</button>
      <label class="btn" for="importFile" style="cursor:pointer">メモを読み込む</label>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script src="data/terms-1-alnum.js"></script>
<script src="data/terms-2-a-ka.js"></script>
<script src="data/terms-3-sa.js"></script>
<script src="data/terms-4-ta-ra.js"></script>
<script>
(function(){
"use strict";

var THEMES = [
  ["threat","攻撃手法・脅威","攻撃"],
  ["actor","攻撃グループ・マルウェア","集団"],
  ["ai","AI・AIセキュリティ","AI"],
  ["info","偽・誤情報・情報戦","情報戦"],
  ["tech","セキュリティ技術・対策","技術"],
  ["jplaw","国内の法律・政策・戦略","国内法"],
  ["jpguide","国内のガイドライン・制度","制度"],
  ["jporg","国内の組織・相談窓口","国内組織"],
  ["hr","人材育成・演習・資格","人材"],
  ["world","海外の法律・政策","海外法"],
  ["worldorg","海外の機関","海外機関"],
  ["intl","国際連携・対話","国際"],
  ["std","国際標準・評価認証","標準"],
  ["general","一般用語","一般"]
];
var THEME_NAME = {}, THEME_SHORT = {}; THEMES.forEach(function(t){ THEME_NAME[t[0]] = t[1]; THEME_SHORT[t[0]] = t[2]; });
var STATUS_NAME = ["未学習","学習中","習得"];

// ---- 用語データ（索引の掲載順＝50音順） ----
function hash(s){ var h = 0x811c9dc5; for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return ("0000000"+h.toString(16)).slice(-8); }
var TERMS = (window.TERMS || []).map(function(t, i){
  return { id:"t"+hash(t.t), order:i, s:t.s, t:t.t, p:t.p, c:t.c, d:t.d, e:t.e, u:t.u||"",
           hay:norm(t.t+" "+t.d+" "+t.e+" "+(THEME_NAME[t.c]||"")) };
});
var BY_ID = {}; TERMS.forEach(function(t){ BY_ID[t.id] = t; });
var SECTIONS = []; TERMS.forEach(function(t){ if (SECTIONS.indexOf(t.s) < 0) SECTIONS.push(t.s); });

function norm(s){ return (s||"").normalize("NFKC").toLowerCase(); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function highlight(text, q){
  if (!q) return esc(text);
  var nt = text.normalize("NFKC"), low = nt.toLowerCase(), out = "", i = 0, j;
  while ((j = low.indexOf(q, i)) >= 0){ out += esc(nt.slice(i, j)) + "<mark>" + esc(nt.slice(j, j+q.length)) + "</mark>"; i = j + q.length; }
  return out + esc(nt.slice(i));
}

// ---- 保存（このブラウザ／公開ページではアカウント単位） ----
var LS_KEY = "iswp2026-glossary-notes";
var LS_UI = "iswp2026-glossary-ui";
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

var store = {
  notes: lsGet(LS_KEY) || {},   // id -> {t, status, memo, updated}
  col: null,
  get: function(id){ return this.notes[id] || { status:0, memo:"", updated:0 }; },
  put: function(id, patch){
    var cur = this.get(id);
    var next = { t:BY_ID[id].t, status:cur.status||0, memo:cur.memo||"", updated:Date.now() };
    for (var k in patch) next[k] = patch[k];
    if (!next.status && !next.memo){ delete this.notes[id]; }
    else this.notes[id] = next;
    lsSet(LS_KEY, this.notes);
    if (this.col){
      var ref = this.col.doc(id);
      (this.notes[id] ? ref.set(next) : ref.delete()).catch(function(){ toast("クラウドへの保存に失敗しました。このブラウザには保存されています。"); });
    }
  },
  merge: function(incoming){
    var changed = 0, self = this;
    Object.keys(incoming || {}).forEach(function(id){
      var n = incoming[id]; if (!BY_ID[id] || !n) return;
      var cur = self.notes[id];
      if (!cur || (n.updated||0) > (cur.updated||0)){ self.notes[id] = { t:BY_ID[id].t, status:+n.status||0, memo:String(n.memo||""), updated:n.updated||Date.now() }; changed++; }
    });
    lsSet(LS_KEY, this.notes);
    return changed;
  },
  connect: async function(){
    if (!(window.claude && typeof window.claude.use === "function")) return;
    try {
      var db = await window.claude.use("db"), user = await window.claude.use("user");
      if (!db || !user) return;
      var uid = await user.id(); if (!uid) return;
      var col = db.collection("data/users/" + uid);
      var snap = await col.get(), remote = {};
      snap.docs.forEach(function(d){ remote[d.id] = d.data(); });
      // ローカルにしかない新しい記録はクラウドへ送る
      var self = this, local = this.notes;
      this.merge(remote);
      Object.keys(local).forEach(function(id){
        var r = remote[id];
        if (!r || (local[id].updated||0) > (r.updated||0)) col.doc(id).set(local[id]).catch(function(){});
      });
      this.col = col;
      document.getElementById("storeInfo").textContent = "メモと学習状態はあなたのアカウントに保存され、他の端末からも見られます（他の人には見えません）。";
      renderAll();
    } catch(e){}
  }
};

// ---- 画面の状態 ----
var ui = Object.assign({ mode:"kana", status:"all" }, lsGet(LS_UI) || {});
var state = { q:"", current:null, visible:[] };
function saveUI(){ lsSet(LS_UI, { mode:ui.mode, status:ui.status }); }

var $ = function(id){ return document.getElementById(id); };
var listEl = $("list"), jumpEl = $("jump"), detailEl = $("detail");

function matches(t){
  if (state.q && t.hay.indexOf(state.q) < 0) return false;
  var n = store.get(t.id);
  if (ui.status === "memo") return !!n.memo;
  if (ui.status !== "all") return String(n.status||0) === ui.status;
  return true;
}

function groups(){
  var vis = TERMS.filter(matches), out = [];
  if (ui.mode === "kana"){
    SECTIONS.forEach(function(s){ var items = vis.filter(function(t){ return t.s === s; }); if (items.length) out.push({ key:s, label:s, items:items }); });
  } else {
    THEMES.forEach(function(th){ var items = vis.filter(function(t){ return t.c === th[0]; }); if (items.length) out.push({ key:th[0], label:th[1], short:th[2], items:items }); });
  }
  return out;
}

function renderList(){
  var gs = groups(), html = "", vis = [];
  gs.forEach(function(g, gi){
    html += '<div class="group-h" id="g-' + gi + '" role="presentation"><span>' + esc(g.label) + '</span><small>' + g.items.length + '</small></div>';
    g.items.forEach(function(t){
      vis.push(t.id);
      var n = store.get(t.id), st = n.status||0;
      html += '<button type="button" class="item" role="listitem" data-id="' + t.id + '"' + (t.id === state.current ? ' aria-current="true"' : '') + '>' +
        '<span class="dot' + (st===1?' l':st===2?' m':'') + '" title="' + STATUS_NAME[st] + '"></span>' +
        '<span class="t">' + highlight(t.t, state.q) + (n.memo ? '<span class="memo-mark" title="メモあり">✎</span>' : '') + '</span>' +
        '<span class="p">p.' + esc(t.p.split(",")[0]) + '</span></button>';
    });
  });
  state.visible = vis;
  listEl.innerHTML = html || '<div class="empty">条件に合う用語はありません。<br>検索語や絞り込みを変えてみてください。</div>';
  jumpEl.innerHTML = gs.map(function(g, gi){
    var short = g.short || g.label;
    return '<button type="button" data-g="' + gi + '" title="' + esc(g.label) + '">' + esc(short) + '</button>';
  }).join("");
  $("count").textContent = vis.length === TERMS.length ? "全 " + TERMS.length + " 語" : vis.length + " / " + TERMS.length + " 語";
  $("modeKana").setAttribute("aria-pressed", ui.mode === "kana");
  $("modeTheme").setAttribute("aria-pressed", ui.mode === "theme");
  $("fStatus").value = ui.status;
}

function renderProgress(){
  var m = 0, l = 0;
  TERMS.forEach(function(t){ var s = store.get(t.id).status; if (s === 2) m++; else if (s === 1) l++; });
  $("nM").textContent = m; $("nL").textContent = l; $("nU").textContent = TERMS.length - m - l; $("nAll").textContent = TERMS.length;
  $("barM").style.width = (m / TERMS.length * 100) + "%"; $("barL").style.width = (l / TERMS.length * 100) + "%";
}

function renderDetail(){
  var t = BY_ID[state.current];
  if (!t){ detailEl.innerHTML = '<div class="card"><p class="empty">左の索引から用語を選んでください。</p></div>'; return; }
  var n = store.get(t.id), idx = state.visible.indexOf(t.id);
  var pages = t.p.split(",").map(function(x){ return "<b>" + esc(x.trim()) + "</b>"; }).join("、");
  detailEl.innerHTML =
    '<article class="card">' +
      '<div class="card-nav">' +
        '<button type="button" class="btn back" id="backBtn">← 索引へ</button>' +
        '<div class="row" style="margin-left:auto">' +
          '<button type="button" class="btn" id="prevBtn"' + (idx <= 0 ? " disabled" : "") + '>← 前の語</button>' +
          '<button type="button" class="btn" id="nextBtn"' + (idx < 0 || idx >= state.visible.length-1 ? " disabled" : "") + '>次の語 →</button>' +
        '</div>' +
      '</div>' +
      '<div class="chips"><span class="chip sec" title="索引の見出し">' + esc(t.s) + '</span>' +
        '<button type="button" class="chip" id="themeChip" title="このテーマの一覧を表示">' + esc(THEME_NAME[t.c] || t.c) + '</button></div>' +
      '<h2>' + highlight(t.t, state.q) + '</h2>' +
      '<div class="pages">白書の掲載ページ　p. ' + pages + '</div>' +
      '<div class="block"><div class="label">定義</div><p class="def">' + highlight(t.d, state.q) + '</p></div>' +
      '<div class="block"><div class="label">説明</div><p class="exp">' + highlight(t.e, state.q) + '</p></div>' +
      '<div class="block url"><div class="label">公式URL</div>' +
        (t.u ? '<a href="' + esc(t.u) + '" target="_blank" rel="noopener noreferrer">' + esc(t.u) + '</a>'
             : '<span class="none">公式サイトはありません。白書の掲載ページを参照してください。</span>') + '</div>' +
      '<div class="study">' +
        '<div><div class="label">学習状態</div><div class="status" role="group" aria-label="学習状態">' +
          [0,1,2].map(function(v){ return '<button type="button" data-v="' + v + '" aria-pressed="' + ((n.status||0) === v) + '">' + STATUS_NAME[v] + '</button>'; }).join("") +
        '</div></div>' +
        '<div><label class="label" for="memo">メモ</label>' +
          '<textarea id="memo" placeholder="自分の言葉での要約、関連する事件、試験対策のポイントなどを書いておけます。入力は自動で保存されます。">' + esc(n.memo || "") + '</textarea>' +
          '<div class="memo-foot"><span id="memoState">' + (n.updated ? "最終更新 " + fmt(n.updated) : "まだメモはありません") + '</span><span>Ctrl / ⌘ + Enter で次の語へ</span></div></div>' +
      '</div>' +
    '</article>';
}

function fmt(ms){ var d = new Date(ms); function z(x){ return ("0"+x).slice(-2); } return d.getFullYear()+"/"+z(d.getMonth()+1)+"/"+z(d.getDate())+" "+z(d.getHours())+":"+z(d.getMinutes()); }

function renderAll(){ renderProgress(); renderList(); renderDetail(); }

function select(id, opts){
  if (!BY_ID[id]) return;
  flushMemo();
  state.current = id;
  listEl.querySelectorAll('.item[aria-current="true"]').forEach(function(el){ el.removeAttribute("aria-current"); });
  var el = listEl.querySelector('.item[data-id="' + id + '"]');
  if (el){ el.setAttribute("aria-current", "true"); if (!opts || opts.scroll !== false) el.scrollIntoView({ block:"nearest" }); }
  renderDetail();
  detailEl.scrollTop = 0;
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  if (opts && opts.open) document.body.classList.add("detail-open");
}

// メモは入力が止まってから保存
var memoTimer = null, memoPending = null;
function flushMemo(){
  if (!memoPending) return;
  clearTimeout(memoTimer);
  var p = memoPending; memoPending = null;
  if ((store.get(p.id).memo || "") !== p.text){
    store.put(p.id, { memo:p.text });
    var s = $("memoState"); if (s) s.textContent = "保存しました（" + fmt(Date.now()) + "）";
    renderProgress();
    var item = listEl.querySelector('.item[data-id="' + p.id + '"] .t');
    if (item){ var has = !!p.text, mk = item.querySelector(".memo-mark"); if (has && !mk) item.insertAdjacentHTML("beforeend", '<span class="memo-mark" title="メモあり">✎</span>'); if (!has && mk) mk.remove(); }
  }
}

function step(dir){
  var i = state.visible.indexOf(state.current) + dir;
  if (i >= 0 && i < state.visible.length) select(state.visible[i]);
}

var toastTimer;
function toast(msg){ var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 2600); }

// ---- イベント ----
listEl.addEventListener("click", function(e){ var b = e.target.closest(".item"); if (b) select(b.dataset.id, { scroll:false, open:true }); });
jumpEl.addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b) return; var h = $("g-" + b.dataset.g); if (h) listEl.scrollTop = h.offsetTop - listEl.offsetTop; });

var qTimer;
$("q").addEventListener("input", function(e){ clearTimeout(qTimer); qTimer = setTimeout(function(){ state.q = norm(e.target.value.trim()); renderList(); renderDetail(); listEl.scrollTop = 0; }, 120); });
$("modeKana").addEventListener("click", function(){ ui.mode = "kana"; saveUI(); renderList(); listEl.scrollTop = 0; select(state.current); });
$("modeTheme").addEventListener("click", function(){ ui.mode = "theme"; saveUI(); renderList(); listEl.scrollTop = 0; select(state.current); });
$("fStatus").addEventListener("change", function(e){ ui.status = e.target.value; saveUI(); renderList(); renderDetail(); listEl.scrollTop = 0; });
$("nextUnlearned").addEventListener("click", function(){
  var start = Math.max(0, state.visible.indexOf(state.current) + 1), order = state.visible.slice(start).concat(state.visible.slice(0, start));
  var id = order.filter(function(x){ return !(store.get(x).status) && x !== state.current; })[0];
  if (id) select(id, { open:true }); else toast("表示中の一覧に未学習の語はありません。");
});

detailEl.addEventListener("click", function(e){
  var t = e.target;
  if (t.closest("#backBtn")){ flushMemo(); document.body.classList.remove("detail-open"); return; }
  if (t.closest("#prevBtn")) return step(-1);
  if (t.closest("#nextBtn")) return step(1);
  if (t.closest("#themeChip")){ ui.mode = "theme"; saveUI(); renderList(); select(state.current); document.body.classList.remove("detail-open"); return; }
  var sb = t.closest(".status button");
  if (sb){
    var v = +sb.dataset.v; store.put(state.current, { status:v });
    detailEl.querySelectorAll(".status button").forEach(function(b){ b.setAttribute("aria-pressed", String(+b.dataset.v === v)); });
    var dot = listEl.querySelector('.item[data-id="' + state.current + '"] .dot'); if (dot) dot.className = "dot" + (v===1?" l":v===2?" m":"");
    renderProgress();
    if (ui.status !== "all" && ui.status !== "memo"){ renderList(); }
  }
});
detailEl.addEventListener("input", function(e){
  if (e.target.id !== "memo") return;
  memoPending = { id:state.current, text:e.target.value };
  var s = $("memoState"); if (s) s.textContent = "入力中…";
  clearTimeout(memoTimer); memoTimer = setTimeout(flushMemo, 700);
});
detailEl.addEventListener("focusout", function(e){ if (e.target.id === "memo") flushMemo(); });
detailEl.addEventListener("keydown", function(e){ if (e.target.id === "memo" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); step(1); } });
document.addEventListener("keydown", function(e){
  if (e.target.matches("input,textarea,select")) return;
  if (e.key === "ArrowDown" || e.key === "j"){ e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp" || e.key === "k"){ e.preventDefault(); step(-1); }
  else if (e.key === "/"){ e.preventDefault(); $("q").focus(); }
});
window.addEventListener("pagehide", flushMemo);
window.addEventListener("hashchange", function(){ var id = location.hash.slice(1); if (BY_ID[id] && id !== state.current) select(id, { open:true }); });

// 書き出し・読み込み
$("exportBtn").addEventListener("click", async function(){
  flushMemo();
  var data = JSON.stringify({ app:"iswp2026-glossary", version:1, exported:new Date().toISOString(), notes:store.notes }, null, 2);
  var name = "白書2026索引メモ_" + new Date().toISOString().slice(0,10) + ".json";
  try {
    var dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl){ await dl.save({ filename:name, data:data }); return; }
  } catch(e){ if (e && e.code === "cancelled") return; }
  try {
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type:"application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  } catch(e){ toast("書き出しできませんでした。"); }
});
$("importFile").addEventListener("change", function(e){
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var obj = JSON.parse(r.result), n = store.merge(obj.notes || obj);
      if (store.col) Object.keys(store.notes).forEach(function(id){ store.col.doc(id).set(store.notes[id]).catch(function(){}); });
      renderAll(); toast(n + " 語分のメモと学習状態を読み込みました。");
    } catch(err){ toast("読み込めませんでした。このアプリで書き出したJSONファイルを選んでください。"); }
    e.target.value = "";
  };
  r.readAsText(f);
});

// ---- 起動 ----
var initial = location.hash.slice(1);
state.current = BY_ID[initial] ? initial : TERMS[0] && TERMS[0].id;
renderAll();
if (BY_ID[initial]){ select(initial, { open:true }); }
store.connect();
})();
</script>
</body>
</html>
